services:
  mysql:
    image: mysql:8.4
    container_name: clinica-estetica-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_estetica
      MYSQL_ROOT_PASSWORD: clinica123
    ports:
      - "3306:3306"
    volumes:
      - clinica_mysql_data:/var/lib/mysql
volumes:
  clinica_mysql_data:
